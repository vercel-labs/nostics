ignoreWorkspaceRootCheck: true
catalogMode: prefer
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - tinyclip@0.1.13
  - chokidar@4.0.3
  - semver@6.3.1

shellEmulator: true

packages:
  - playground
  - demo-lib
  - docs
  - packages/*
  - examples/*
# Force a single h3 (Nitro 2.13.4 / Nuxt 4.4.8 use v1). Without this, @nuxt/content
# (which does not pin h3) resolves to the h3 v2 RC pulled in by docus/@nuxtjs/mcp-toolkit
# and vite-devtools, breaking server-side queryCollection (event.req.headers.entries).
overrides:
  h3: 1.15.11

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: false
  sharp: true
  simple-git-hooks: true
  vue-demi: false

catalogs:
  cli:
    '@antfu/eslint-config': ^9.5.1
    '@antfu/ni': ^30.6.0
    '@posva/prompts': ^2.4.4
    '@size-limit/esbuild-why': ^14.0.0
    '@size-limit/preset-small-lib': ^14.0.0
    '@vitejs/devtools': ^0.7.5
    conventional-changelog: ^8.1.3
    conventional-changelog-angular: ^9.4.0
    esbuild: ^0.28.2
    eslint: ^10.11.0
    lint-staged: ^17.5.1
    oxfmt: ^0.68.0
    publint: ^0.3.24
    semver: ^7.8.5
    simple-git-hooks: ^2.14.0
    size-limit: ^14.0.0
    tsdown: ^0.23.0
    typescript: ^6.0.0
    vite: ^8.3.0
    vite-plugin-inspect: 12.0.2
    vue-tsc: ^3.3.11
  deps:
    magic-string: ^1.4.1
    oxc-parser: ^0.150.0
    unplugin: ^3.4.0
  docs:
    '@nuxt/fonts': 0.14.0
    '@nuxt/ui': ^4.11.1
    '@vercel/analytics': ^2.0.1
    '@vercel/speed-insights': ^2.0.0
    better-sqlite3: ^13.0.3
    docus: ^5.13.0
    nuxt: ^4.5.2
  inlined:
    '@antfu/utils': ^9.3.0
  playground:
    '@vitejs/plugin-vue': ^6.0.9
    vue: ^3.5.43
  testing:
    '@vitest/coverage-v8': 5.0.1
    '@vitest/ui': 5.0.1
    tsnapi: ^1.5.0
    vitest: ^5.0.1
  types:
    '@types/node': ^26.6.2
    '@types/semver': ^7.8.0
