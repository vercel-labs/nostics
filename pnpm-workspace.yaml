ignoreWorkspaceRootCheck: true
catalogMode: prefer
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - tinyclip@0.1.13
  - chokidar@4.0.3
  - semver@6.3.1

shellEmulator: true

packages:
  - playground
  - demo-lib
  - docs
  - packages/*
  - examples/*
# Force a single h3 (Nitro 2.13.4 / Nuxt 4.4.8 use v1). Without this, @nuxt/content
# (which does not pin h3) resolves to the h3 v2 RC pulled in by docus/@nuxtjs/mcp-toolkit
# and vite-devtools, breaking server-side queryCollection (event.req.headers.entries).
overrides:
  h3: 1.15.11

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: false
  sharp: true
  simple-git-hooks: true
  vue-demi: false

catalogs:
  cli:
    '@posva/prompts': ^2.4.4
    '@size-limit/esbuild-why': ^14.3.0
    '@size-limit/preset-small-lib': ^14.3.0
    '@vitejs/devtools': ^0.8.3
    conventional-changelog: ^8.1.3
    conventional-changelog-angular: ^9.4.0
    esbuild: ^0.28.2
    lint-staged: ^17.6.0
    oxfmt: ^0.78.0
    oxlint: ^1.93.0
    oxlint-plugin-posva: ^0.0.2
    publint: ^0.3.25
    semver: ^7.8.6
    simple-git-hooks: ^2.14.0
    size-limit: ^14.3.0
    tsdown: ^0.23.7
    typescript: ^7.0.2
    vite: ^8.3.8
    vite-plugin-inspect: 12.1.0
    vue-tsc: ^3.3.14
  deps:
    magic-string: ^1.4.5
    oxc-parser: ^0.158.0
    unplugin: ^3.7.0
  docs:
    '@nuxt/fonts': 1.2.0
    '@nuxt/ui': ^4.12.0
    '@vercel/analytics': ^2.0.1
    '@vercel/speed-insights': ^2.1.0
    better-sqlite3: ^13.2.0
    docus: ^5.15.0
    nuxt: ^4.6.4
  playground:
    '@vitejs/plugin-vue': ^6.0.11
    vue: ^3.5.45
  testing:
    '@vitest/coverage-v8': 5.1.0
    tsnapi: ^1.6.1
    vitest: ^5.1.0
  types:
    '@types/node': ^26.6.6
    '@types/semver': ^7.8.0
